version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-docops-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      # Database (optional - sử dụng SQLite mặc định hoặc PostgreSQL)
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=postgres
      # - DB_POSTGRESDB_DATABASE=n8n
      # - DB_POSTGRESDB_USER=n8n
      # - DB_POSTGRESDB_PASSWORD=n8n
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount workflows folder nếu có
      # - ./n8n-workflows:/home/node/.n8n/workflows
    networks:
      - ai-docops-network

  # PostgreSQL (Optional - nếu muốn dùng database riêng)
  # postgres:
  #   image: postgres:15
  #   container_name: ai-docops-postgres
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=n8n
  #     - POSTGRES_USER=n8n
  #     - POSTGRES_PASSWORD=n8n
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - ai-docops-network

volumes:
  n8n_data:
  # postgres_data:

networks:
  ai-docops-network:
    driver: bridge




